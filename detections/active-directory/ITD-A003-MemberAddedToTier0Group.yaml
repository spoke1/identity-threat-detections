id: 183e739d-59a9-49e5-9fa6-77f277913758
detectionId: ITD-A003
name: Member added to a Tier-0 group
description: |
  Detects additions to the built-in privileged groups of Active Directory:
  Administrators, Domain Admins, Enterprise Admins, Schema Admins, Account,
  Server, Print and Backup Operators, Group Policy Creator Owners, Key Admins and
  Enterprise Key Admins. Groups are matched by well-known SID and RID, so the
  rule also works in domains with localised group names.
severity: High
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsSecurityEvents
    dataTypes:
      - SecurityEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
  - PrivilegeEscalation
relevantTechniques:
  - T1098.007
query: |
  let Tier0BuiltinGroupSids = dynamic(["S-1-5-32-544", "S-1-5-32-548", "S-1-5-32-549", "S-1-5-32-550", "S-1-5-32-551"]);
  // Domain Admins, Schema Admins, Enterprise Admins, Group Policy Creator Owners, Key Admins, Enterprise Key Admins
  let Tier0GroupRids = dynamic(["512", "518", "519", "520", "526", "527"]);
  SecurityEvent
  // 4728 global, 4732 domain local, 4756 universal security group
  | where EventID in (4728, 4732, 4756)
  | extend GroupRid = extract(@"-(\d+)$", 1, TargetSid)
  | where TargetSid in (Tier0BuiltinGroupSids) or (TargetSid startswith "S-1-5-21-" and GroupRid in (Tier0GroupRids))
  | project TimeGenerated, Computer, Activity, GroupName = TargetUserName, GroupSid = TargetSid, MemberName, MemberSid, SubjectAccount, SubjectUserName, SubjectUserSid
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: SubjectUserName
      - identifier: Sid
        columnName: SubjectUserSid
  - entityType: Account
    fieldMappings:
      - identifier: Sid
        columnName: MemberSid
  - entityType: Host
    fieldMappings:
      - identifier: FullName
        columnName: Computer
falsePositives:
  - Approved admin onboarding. With a tiered admin model these changes are rare and ticketed.
  - Members added temporarily for a maintenance task. They should also be removed again (event 4729, 4733, 4757).
triage:
  - Is there an approved request for this membership?
  - Who made the change, and from which session? A change made by an account that is itself new to Tier 0 is a strong signal.
  - If not legitimate, remove the member, disable the account and investigate the acting account.
preventiveControls:
  - hybrid-workplace-automation · Get-ADTier0Exposure.ps1 (review of PrivilegedAccounts.csv)
references:
  - https://attack.mitre.org/techniques/T1098/007/
  - https://learn.microsoft.com/windows-server/identity/ad-ds/manage/understand-security-identifiers
version: 1.0.0
kind: Scheduled
